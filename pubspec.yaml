# Official WooSignal App Template for WooCommerce

# WooGym - Book Gym Classes - Flutter App Template
# Version: 2.0.0
# Author: Anthony Gordon
# Homepage: https://woosignal.com
# Documentation: https://woosignal.com/docs/app/woogym

### Change App Icon
# 1 Replace: public/assets/icon/appicon.png (1024px1024px icon size)
# 2 Run this command from the terminal: "dart run flutter_launcher_icons:main"

### Uploading the IOS/Android app
# IOS https://flutter.dev/docs/deployment/ios
# Android https://flutter.dev/docs/deployment/android

name: flutter_app
description: 'WooGym - Book Gym Classes - Flutter App Template'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0 <4.0.0"
dependencies:
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  analyzer: ^7.7.0
  intl: ^0.19.0
  nylo_framework: ^6.8.13
  pretty_dio_logger: ^1.4.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.3.0
  font_awesome_flutter: ^10.8.0
  woosignal: ^4.2.1
  wp_json_api: ^4.3.4
  cached_network_image: ^3.4.1
  package_info_plus: ^8.3.0
  money_formatter: ^0.0.6
  flutter_web_browser: ^0.17.3
  pull_to_refresh_flutter3: 2.0.2
  bubble_tab_indicator: ^0.1.6
  math_expressions: ^3.0.0
  validated: ^2.0.0
  flutter_spinkit: ^5.2.1
  auto_size_text: ^3.0.0
  html: ^0.15.6
  flutter_widget_from_html_core: ^0.17.0
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_swiper_view: ^1.1.8
  firebase_messaging: ^15.2.9
  booking_calendar: ^1.1.10
  table_calendar: ^3.2.0
  firebase_core: ^3.15.1
  collection: ^1.19.1
  flutter_stripe: ^11.5.0
  razorpay_flutter: ^1.4.0
  video_player: ^2.10.0
  flutter_animate: ^4.5.2
  add_2_calendar: ^3.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: ^6.1.5

dependency_overrides:
  intl: 0.19.0

dev_dependencies:
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  # The following line 'flutter_lints' activates a set of recommended lints for Flutter apps,
  # packages, and plugins designed to encourage good coding practices.
#  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# APP ICON - public/app_icon/appicon.png
# Build icons: "dart run flutter_launcher_icons"
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "public/app_icon/appicon.png"
  remove_alpha_ios: true

# RENAME YOUR PROJECT
# flutter pub run rename setAppName --targets ios,android --value "YourAppName"

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - public/fonts/
    - public/images/
    - public/json/
    - public/videos/
    - public/app_icon/
    - lang/
    - .env
